name: Deploy Pages

on:
  # Auto-deploy-on-push temporarily disabled to avoid GitHub Actions billing
  # after the account's included minutes were used up for this cycle.
  # Re-enable the `push` trigger below once minutes reset (Sept 1, 2026),
  # or run this workflow manually via workflow_dispatch in the meantime.
  # push:
  #   branches:
  #     - claude/wrexham-fc26-career-dx9xgx
  #   paths:
  #     - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
